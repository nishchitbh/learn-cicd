name: CI/CD FastAPI

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -t fastapi-cicd .

    - name: Save Docker image
      run: |
        docker save fastapi-cicd | gzip > fastapi-cicd.tar.gz
    - name: List files before SCP
      run: ls -la

    - name: Copy image to server
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        source: fastapi-cicd.tar.gz, docker-compose.yml
        target: "~/apps/fastapi-cicd"

    - name: Deploy on server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          cd ~/apps/fastapi-cicd
          docker load < fastapi-cicd.tar.gz
          docker compose down
          docker compose up -d
